device: cuda
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  max_images: 20000
model:
  image_size: 112
  lr_scale: 4
  emb_dim: 128
train:
  protocol: full
  seed: 42
  batch_size: 64
  num_workers: 4
  epochs: 5
  lr: 0.001
  cosface_s: 30.0
  cosface_m: 0.35
  alpha_cross: 1.0
  beta_neg: 0.5
eval:
  max_ids: 300
  probes_per_id: 2
  max_lfw_pairs: null
  batch_size: 64
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  figure_dir: outputs/figures/full
  pred_dir: outputs/predictions/full
